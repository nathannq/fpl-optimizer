# Single source of configuration. Relative paths are resolved from the repo root.

paths:
  raw_history: data/raw/vaastav        # downloaded historical seasons (gitignored)
  api_cache: data/cache/api            # timestamped FPL API responses
  snapshots: data/snapshots            # archived bootstrap-static (for future ep_next backtests)
  processed: data/processed            # feature table and predictions (parquet)
  models: models                       # trained model files + metadata (gitignored)
  reports: reports                     # generated, committed results

history:
  repo: vaastav/Fantasy-Premier-League
  # Pinned commit so the training data is reproducible. Use "master" to take the latest.
  ref: d7b05b51d137bfefef4b692386d18c610975b9b9
  seasons: ["2022-23", "2023-24", "2024-25", "2025-26"]   # first seasons with xG/xA
  files: ["gws/merged_gw.csv", "players_raw.csv", "teams.csv", "fixtures.csv"]
  # vaastav's xP column is all zeros in gameweeks where the scrape failed;
  # a gameweek's xP is kept only if at least this share of rows is non-zero.
  xp_valid_min_nonzero_share: 0.2

live:
  season: "2026-27"                    # the current season comes from the official API
  base_url: https://fantasy.premierleague.com/api
  request_workers: 4
  ttl_seconds:                         # how long a cached response counts as fresh
    bootstrap: 3600
    fixtures: 3600
    element_summary: 43200
    entry: 300
    league: 300

features:
  rolling_windows: [3, 5]              # player form windows, in team fixtures
  team_window: 6                       # team strength window, in matches
  per90_min_minutes: 90                # per-90 rates need at least this many minutes in the window
  fixture_horizon: 3                   # "next N gameweeks" fixture difficulty
  # Teams with no prior matches in the data (promoted sides) start from these per-match values.
  promoted_prior:
    xg_for: 1.05
    xg_against: 1.75
    goals_for: 1.0
    goals_against: 1.8
    points: 0.9
    clean_sheet: 0.15

targets:
  haul_points: 8                       # "haul" classifier target: points >= this
  return_points: 5                     # a "return" in the differential evaluation
  multi_gw_horizon: 3                  # optional target: points over the next N gameweeks

evaluation:
  seasons: ["2023-24", "2024-25", "2025-26", "2026-27"]   # Phase 1 baseline report
  top_k: 10                            # differentials flagged per gameweek

model:
  seed: 42
  # Walk-forward validation by season: each season is predicted by models trained only on
  # earlier seasons. Dev seasons are used to choose the differential-score weights;
  # test seasons are never used for any choice.
  dev_seasons: ["2024-25"]
  test_seasons: ["2025-26", "2026-27"]
  early_stopping_rounds: 100           # tuned on the last training season (time-based)
  ridge_alpha: 10.0
  lightgbm:
    n_estimators: 3000                 # upper bound; early stopping picks the number
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 5.0

differential:
  ownership_max_pct: 10.0              # a differential is owned by fewer than this % of managers
  # score = pred_points + haul_weight * P(haul) + edge_weight * (pred_points - implied_points)
  #         - price_weight * price
  # where implied_points is what ownership + price + position + fixtures alone predict.
  # Weights are chosen from this grid on the dev seasons only.
  grid:
    haul_weight: [0.0, 2.0, 5.0, 10.0]
    edge_weight: [0.0, 0.5, 1.0]
    price_weight: [0.0, 0.25, 0.5]

optimizer:
  budget: 1000                         # tenths of £m: a new squad costs at most £100.0m
  hit_cost: 4                          # points per transfer beyond the free ones
  max_free_transfers: 5                # free transfers bank up to this
  max_transfers: 2                     # options compared each week: 0..max_transfers transfers
  min_gain_per_transfer: 0.5           # recommend one more transfer only if it adds at least this
  bench_weight: 0.1                    # weight on bench points (autosub cover) in the objective
  min_chance_of_playing: 75            # below this %, a player can't be bought or started
  differential_bonus: 0.0              # e.g. 0.1 = +10% on differentials' projected points (objective only)
  projection: model                    # default projection source: model | ep_next
  solver_time_limit: 30                # seconds per solve

backtest:
  # Replays a season week by week: the optimizer picks transfers, XI and captain from each
  # projection source, and is scored on what actually happened (with autosubs).
  seasons: ["2024-25", "2025-26"]
  start_gw: 2                          # prices are known from the previous gameweek
  sources:                             # name -> projection column in the out-of-sample predictions
    model: lgbm_points
    last3: base_last3
    ep_next: ep_next                   # from archived live snapshots; skipped until a season has them
