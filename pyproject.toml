[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fplopt"
version = "0.1.0"
description = "Fantasy Premier League breakout & differential finder with a transfer optimizer"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
fplopt = "fplopt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: uses the downloaded historical data; skipped when it is missing"]
